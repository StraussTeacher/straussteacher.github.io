<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wissensportal – Computersysteme und Hardware</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--teal:#0b5563;--teal2:#0e6b7c;--orange:#f39229;--bg:#f4f7f8;--line:#d6e0e3;--text:#1f2d33;--muted:#55666d}
body{font-family:"Segoe UI",Arial,sans-serif;background:var(--bg);color:var(--text);font-size:17px;line-height:1.6}
.top{background:#fff;border-bottom:4px solid var(--teal);padding:10px 16px}
.top .in{max-width:1000px;margin:0 auto;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.top img{height:54px}
.top .t1{font-weight:700;color:var(--teal);font-size:1.15rem}
.top .t2{color:var(--muted);font-size:.9rem}
main{max-width:1000px;margin:0 auto;padding:22px 16px 40px}
h1{font-size:1.6rem;color:var(--teal);margin-bottom:4px}
.lead{color:var(--muted);margin-bottom:20px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
.mcard{background:#fff;border:2px solid var(--line);border-radius:12px;padding:20px}
.mcard .ic{font-size:2rem}
.mcard h2{color:var(--teal);font-size:1.2rem;margin:6px 0}
.mcard p{color:var(--muted);font-size:.95rem;margin-bottom:14px}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.b{display:inline-block;padding:10px 16px;border-radius:8px;font-weight:700;text-decoration:none;font-size:.95rem}
.b.p{background:var(--teal);color:#fff}
.b.s{background:#fff;color:var(--teal);border:2px solid var(--teal)}
.b:hover{filter:brightness(1.1)}
.empty{background:#fff;border:2px dashed var(--line);border-radius:12px;padding:20px;color:var(--muted)}
.foot{max-width:1000px;margin:0 auto;padding:0 16px 30px;color:var(--muted);font-size:.8rem}
</style>
</head>
<body>
<div class="top"><div class="in">
  <img src="../../assets/logo_coded_in_franconia.png" alt="Coded in Franconia">
  <div><div class="t1">Wissensportal</div><div class="t2">Coded in Franconia · Team Systemtechnik</div></div>
</div></div>
<main>
  <h1>Computersysteme und Hardware</h1>
  <p class="lead">Schulungsunterlagen für neue Mitarbeitende.</p>
  <div class="empty">Zu diesem Bereich sind noch keine Schulungsunterlagen eingestellt.</div>
</main>
<div class="foot">Interne Schulungsunterlagen · Coded in Franconia</div>
</body>
</html>
